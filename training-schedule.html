<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horn Lake Training Schedule</title>
  <link rel="stylesheet" href="/live-document.css?v=5" />
</head>
<body>
  <main class="doc-page">
    <header class="doc-header">
      <div class="brand">
        <img src="/horn-lake-logo.png" alt="Horn Lake Fire Department" />
        <div>
          <div class="kicker">Horn Lake Fire Department</div>
          <h1>Training Schedule</h1>
          <div id="documentDate" class="subline">Loading schedule</div>
        </div>
      </div>
      <div class="status">
        <div><span class="live-dot"></span><span id="statusText">Connecting</span></div>
        <div id="updatedText">Last Updated --</div>
      </div>
    </header>

    <section class="doc-grid single-grid">
      <article class="panel wide">
        <div class="panel-head">
          <h2 id="sectionTitle">Training Schedule</h2>
        </div>
        <div id="sectionTable" class="table-wrap"></div>
      </article>
    </section>
  </main>

  <script>
    window.DISPLAY_CONFIG = {
      title: 'Training Schedule',
      apiPath: '/api/training-schedule'
    };
  </script>
  <script src="/document-section.js?v=1"></script>
</body>
</html>
