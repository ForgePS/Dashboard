<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horn Lake Radar</title>
  <link rel="stylesheet" href="/weather-radar.css?v=4" />
</head>
<body>
  <div id="radarShell" class="radar-shell">
    <header class="radar-header">
      <h1>Horn Lake Radar</h1>
      <p id="updatedText">Windy live radar (MVIX)</p>
    </header>
    <iframe
      id="radarFrame"
      class="radar-visual"
      title="Horn Lake Windy Radar"
      loading="lazy"
      referrerpolicy="no-referrer"
    ></iframe>
    <img id="radarFallback" class="radar-visual radar-fallback-hidden" alt="Local weather radar loop fallback" />
  </div>
  <script src="/weather-radar.js?v=4"></script>
</body>
</html>
